[project]
name = "rsvlm-reliability"
version = "0.1.0"
description = "A reproducible harness for evaluating whether remote-sensing VLMs use imagery under controlled reliability conditions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "num2words>=0.5.14",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "tabulate>=0.10.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[project.scripts]
rsvlm = "rsvlm_reliability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsvlm_reliability"]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
