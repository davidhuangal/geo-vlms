[project]
name = "geo-vlms"
version = "0.1.0"
description = "A reproducible harness for evaluating vision-language models on remote-sensing imagery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "openai>=1,<3",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
    "tqdm>=4.69.0",
]

[project.optional-dependencies]
hf = [
    "accelerate>=1.14.0",
    # Required at runtime by SmolVLM's processor, not imported by our code.
    "num2words>=0.5.14",
    "pillow>=12.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_vlms"]

[dependency-groups]
dev = [
    "geo-vlms[hf]",
    "ipython>=9.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
